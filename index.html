<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunt Optimizer — Tibia</title>
<meta name="description" content="Ferramenta da comunidade para otimizar hunts no Tibia: filtre spawns, informe sua vocação e atributos, e veja elemento, runa, charms, itens, gemas e loot recomendados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --hide:#1E1B14; --hide-2:#272319; --panel:#2F2A1E; --edge:#453D2B; --edge-2:#332C1F;
  --bone:#EDE6D2; --dim:#A79E88; --mute:#6E6550;
  --terra:#8FB958; --terra-deep:#5E8636; --molten:#D8763A; --ember:#8C4522;
  --el-physical:#C9776B; --el-fire:#D8763A; --el-ice:#6FB8D9; --el-energy:#C9A6E8; --el-earth:#8FB958; --el-death:#7C6B96; --el-holy:#E8D48A;
  --voc-knight:#C1704A; --voc-paladin:#D3A94B; --voc-sorcerer:#9A7ADB; --voc-druid:#8FB958;
  --ff-d:"Grenze",Georgia,serif; --ff-b:"IBM Plex Sans",system-ui,sans-serif; --ff-m:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--hide);color:var(--bone);font-family:var(--ff-b);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--terra)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--molten);outline-offset:2px}
h1,h2,h3,h4{margin:0}
p{margin:0 0 .6rem;color:var(--dim)}
.mono{font-family:var(--ff-m)}

/* ================= SHELL ================= */
.shell{display:flex;flex-direction:column;height:100vh}
.topbar{
  flex:none;display:flex;align-items:center;gap:.8rem;padding:0 1rem;height:52px;
  border-bottom:1px solid var(--edge);background:var(--hide-2);z-index:30
}
.burger{
  width:34px;height:34px;flex:none;border:1px solid var(--edge);border-radius:4px;background:var(--panel);
  color:var(--bone);cursor:pointer;display:flex;align-items:center;justify-content:center
}
.burger:hover{border-color:var(--terra)}
.burger svg{width:16px;height:16px}
.brand{font-family:var(--ff-d);font-weight:800;font-size:1.25rem;color:#FFF8E6;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--terra)}
.topbar-sub{font-family:var(--ff-m);font-size:.68rem;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:none}
@media(min-width:720px){.topbar-sub{display:block}}
.topbar-fill{flex:1}
.topbar-voc{display:flex;align-items:center;gap:.5rem;font-family:var(--ff-m);font-size:.72rem;color:var(--dim)}
.voc-dot{width:9px;height:9px;border-radius:50%;flex:none}

.body{flex:1;display:flex;min-height:0;position:relative}

/* ---- sidebar ---- */
.sidebar{
  width:322px;flex:none;background:var(--hide-2);border-right:1px solid var(--edge);
  overflow-y:auto;transition:margin-left .22s ease;
}
.shell.collapsed .sidebar{margin-left:-322px}
.sb-section{padding:.95rem 1rem;border-bottom:1px solid var(--edge)}
.sb-title{font-family:var(--ff-m);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:.65rem;display:flex;justify-content:space-between;align-items:center}

/* vocation picker */
.voc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.voc-btn{
  border:1px solid var(--edge);background:var(--panel);border-radius:4px;padding:.5rem .2rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.3rem;color:var(--dim);text-align:center
}
.voc-btn b{font-size:.68rem;font-weight:600;font-family:var(--ff-b)}
.voc-btn i{width:16px;height:16px;border-radius:50%;display:block}
.voc-btn.on{border-color:var(--vc);background:color-mix(in srgb, var(--vc) 16%, var(--panel))}
.voc-btn.on b{color:var(--bone)}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.field{margin-bottom:.55rem}
.field label{display:block;font-family:var(--ff-m);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:.25rem}
.field input,.field select{
  width:100%;background:var(--hide);border:1px solid var(--edge);border-radius:3px;color:var(--bone);
  font-family:var(--ff-m);font-size:.82rem;padding:.4rem .5rem
}
.field input:focus,.field select:focus{border-color:var(--terra);outline:none}
.field small{display:block;font-size:.62rem;color:var(--mute);margin-top:.2rem;line-height:1.4}
.field.full{grid-column:1/-1}

/* filters */
.chiprow{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
.chip-btn{
  font-family:var(--ff-m);font-size:.64rem;letter-spacing:.04em;padding:.3rem .62rem;border-radius:12px;
  border:1px solid var(--edge);background:var(--panel);color:var(--dim);cursor:pointer
}
.chip-btn.on{border-color:var(--terra);color:var(--terra);background:rgba(143,185,88,.1)}
.search-input{
  width:100%;background:var(--hide);border:1px solid var(--edge);border-radius:4px;color:var(--bone);
  font-family:var(--ff-b);font-size:.82rem;padding:.5rem .65rem;margin-bottom:.65rem
}
.search-input:focus{border-color:var(--terra);outline:none}
.sort-row{display:flex;align-items:center;gap:.5rem;font-family:var(--ff-m);font-size:.64rem;color:var(--mute);margin-bottom:.7rem}
.sort-row select{flex:1;background:var(--hide);border:1px solid var(--edge);color:var(--bone);border-radius:3px;padding:.3rem .4rem;font-family:var(--ff-m);font-size:.68rem}

/* hunt list */
.hunt-list{display:flex;flex-direction:column;gap:.5rem}
.hunt-card{
  border:1px solid var(--edge);border-radius:5px;background:var(--panel);padding:.65rem .75rem;cursor:pointer;
  text-align:left;width:100%;color:inherit;display:block
}
.hunt-card:hover{border-color:var(--dim)}
.hunt-card.sel{border-color:var(--terra);background:rgba(143,185,88,.09)}
.hunt-card h4{font-family:var(--ff-d);font-weight:600;font-size:1.02rem;color:#FFF8E6;margin-bottom:.2rem;line-height:1.2}
.hunt-card .loc{font-family:var(--ff-m);font-size:.66rem;color:var(--mute);margin-bottom:.4rem}
.hunt-meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.tag{font-family:var(--ff-m);font-size:.6rem;letter-spacing:.05em;padding:.14em .5em;border-radius:2px;border:1px solid var(--edge);color:var(--dim)}
.tag.fit{border-color:var(--terra-deep);color:var(--terra)}
.empty-note{padding:1.2rem 0;text-align:center;color:var(--mute);font-size:.8rem}

/* ---- backdrop for mobile sidebar ---- */
.backdrop{position:fixed;inset:0;background:rgba(10,9,6,.6);z-index:20;display:none}
.shell.mobile-open .backdrop{display:block}

/* ================= MAIN ================= */
.main{flex:1;overflow-y:auto;min-width:0;position:relative}
.main-in{max-width:920px;margin:0 auto;padding:1.6rem 1.6rem 5rem}

/* landing grid */
.landing h1{font-family:var(--ff-d);font-weight:800;font-size:clamp(1.9rem,4.5vw,2.6rem);color:#FFF8E6;margin-bottom:.5rem}
.landing p.lede{max-width:60ch;font-size:.95rem}
.land-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.9rem;margin-top:1.6rem}
.land-card{border:1px solid var(--edge);border-radius:6px;background:var(--hide-2);padding:1rem 1.1rem;cursor:pointer;text-align:left}
.land-card:hover{border-color:var(--terra-deep)}
.land-card h3{font-family:var(--ff-d);font-size:1.25rem;font-weight:600;color:#FFF8E6;margin-bottom:.3rem}
.land-card .loc{font-family:var(--ff-m);font-size:.68rem;color:var(--mute);margin-bottom:.55rem}
.land-card p{font-size:.8rem;margin-bottom:.6rem}

/* detail header */
.det-head{border-bottom:1px solid var(--edge);padding-bottom:1.2rem;margin-bottom:1.5rem}
.back-btn{
  font-family:var(--ff-m);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  background:none;border:0;cursor:pointer;padding:0;margin-bottom:.9rem;display:flex;align-items:center;gap:.35rem
}
.back-btn:hover{color:var(--terra)}
.det-head h1{font-family:var(--ff-d);font-weight:800;font-size:clamp(1.8rem,4vw,2.5rem);color:#FFF8E6;line-height:1.02}
.det-head .loc{font-family:var(--ff-m);font-size:.75rem;color:var(--mute);margin:.35rem 0 .8rem}
.det-meta{display:flex;flex-wrap:wrap;gap:.4rem}

.voc-banner{
  margin-top:1rem;border:1px solid var(--vc);border-left-width:3px;background:color-mix(in srgb, var(--vc) 10%, var(--hide-2));
  border-radius:0 4px 4px 0;padding:.75rem 1rem;font-size:.86rem;color:var(--bone)
}
.voc-banner b{color:var(--vc)}

section.blk{padding-top:2.1rem}
h2.sect{font-family:var(--ff-d);font-weight:600;font-size:1.35rem;color:#FFF8E6;margin-bottom:.9rem;display:flex;align-items:baseline;gap:.6rem}
h2.sect i{font-family:var(--ff-m);font-style:normal;font-size:.62rem;color:var(--terra-deep);letter-spacing:.08em}
h3.sub{font-family:var(--ff-m);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:1.3rem 0 .55rem}

/* creature cards */
.cre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.cre-card{border:1px solid var(--edge);border-radius:5px;background:var(--hide-2);padding:.8rem .9rem}
.cre-card h4{font-family:var(--ff-d);font-size:1.1rem;font-weight:600;color:#FFF8E6;margin-bottom:.5rem}
.kv{display:flex;justify-content:space-between;font-size:.76rem;padding:.18rem 0;border-bottom:1px solid rgba(69,61,43,.4)}
.kv:last-of-type{border:0}
.kv dt{color:var(--mute);margin:0}
.kv dd{margin:0;font-family:var(--ff-m);color:var(--bone)}
.threat-line{margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--edge);font-size:.72rem;color:var(--mute)}
.threat-line b{color:var(--molten)}

/* matrix */
.matrix{border:1px solid var(--edge);border-radius:5px;background:var(--hide-2);padding:1.1rem 1.2rem}
.mrow{display:grid;grid-template-columns:76px 1fr 42px;gap:.7rem;align-items:center;padding:.3rem 0;border-radius:3px}
.mrow+.mrow{border-top:1px solid rgba(69,61,43,.4)}
.mrow.voc{background:rgba(143,185,88,.06)}
.mname{font-family:var(--ff-m);font-size:.7rem;color:var(--dim)}
.mrow.voc .mname{color:var(--vc);font-weight:600}
.mbar{position:relative;height:20px;background:rgba(69,61,43,.4);border-radius:2px;overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;display:block;border-radius:2px}
.mbar b{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);font-family:var(--ff-m);font-size:.64rem;font-weight:500;color:var(--hide)}
.mavg{font-family:var(--ff-m);font-size:.7rem;text-align:right;color:var(--dim)}

/* callouts */
.note{border-left:2px solid var(--terra-deep);background:rgba(143,185,88,.05);padding:.7rem .95rem;margin:.9rem 0;border-radius:0 3px 3px 0;font-size:.82rem;color:var(--dim)}
.note.warn{border-left-color:var(--molten);background:rgba(216,118,58,.06)}
.note b{color:var(--bone)}
.eq{font-family:var(--ff-m);font-size:.85rem;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:.6rem .85rem;display:inline-block;color:#FFF8E6}
.eq em{font-style:normal;color:var(--terra)}

/* calculator */
.calc{border:1px solid var(--terra-deep);border-radius:5px;background:rgba(143,185,88,.05);padding:1rem 1.1rem;margin-bottom:1.1rem}
.calc .field-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.blist{border:1px solid var(--edge);border-radius:4px;background:var(--hide-2);padding:.8rem .95rem;margin-bottom:.9rem}
.brow{display:grid;grid-template-columns:118px 1fr 56px;gap:.6rem;align-items:center;padding:.28rem 0}
.brow+.brow{border-top:1px solid rgba(69,61,43,.35)}
.blab{font-size:.74rem;color:var(--bone)}
.btrack{height:18px;background:rgba(69,61,43,.4);border-radius:2px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--terra-deep);border-radius:2px}
.brow.top .btrack i{background:var(--terra)}
.bval{font-family:var(--ff-m);font-size:.7rem;text-align:right;color:var(--bone)}

/* playbook lists */
.play{border:1px solid var(--edge);border-radius:5px;background:var(--hide-2);padding:.9rem 1.05rem;margin-bottom:.9rem}
.play ul{margin:0;padding-left:1.1rem}
.play li{font-size:.84rem;color:var(--dim);margin-bottom:.4rem}
.play li b{color:var(--bone)}
.play .verified{display:inline-block;font-family:var(--ff-m);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);border:1px solid var(--terra-deep);border-radius:2px;padding:.1em .5em;margin-bottom:.6rem}

/* loot */
.loot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem}
.loot-col{border:1px solid var(--edge);border-radius:5px;background:var(--hide-2);padding:.85rem .95rem}
.loot-col h4{font-family:var(--ff-d);font-size:1.05rem;font-weight:600;color:#FFF8E6;margin-bottom:.55rem}
.loot-key{display:flex;flex-wrap:wrap;gap:.7rem;font-family:var(--ff-m);font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.rchip{font-size:.68rem;padding:.18em .5em;border-radius:3px;border:1px solid;line-height:1.4}
.rchip.r1{color:var(--mute);border-color:rgba(110,101,80,.5)}
.rchip.r2{color:var(--terra);border-color:rgba(143,185,88,.35)}
.rchip.r3{color:var(--bone);border-color:rgba(237,230,210,.25)}
.rchip.r4{color:var(--molten);border-color:rgba(216,118,58,.45)}
.rchip.r5{color:var(--hide);background:var(--molten);border-color:var(--molten);font-weight:600}
.pdot{color:var(--terra);font-weight:700;margin-right:.3rem}

/* about / images manifest */
.manifest{border:1px dashed var(--edge);border-radius:5px;padding:.85rem 1rem;font-size:.78rem;color:var(--mute)}
.manifest summary{cursor:pointer;color:var(--dim);font-family:var(--ff-m);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.manifest ul{margin:.7rem 0 0;padding-left:1.1rem;columns:2;column-gap:1.4rem}
.manifest li{margin-bottom:.3rem;break-inside:avoid}

footer.app-footer{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--edge);font-size:.72rem;color:var(--mute)}

/* responsive */
@media (max-width:860px){
  .sidebar{position:fixed;top:52px;bottom:0;left:0;z-index:25;box-shadow:2px 0 18px rgba(0,0,0,.4);margin-left:-322px}
  .shell.mobile-open .sidebar{margin-left:0}
  .shell.collapsed .sidebar{margin-left:-322px}
  .main-in{padding:1.2rem 1rem 4rem}
  .mrow,.mhead{grid-template-columns:58px 1fr}
  .mavg{display:none}
  .field-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="shell collapsed" id="shell">

  <header class="topbar">
    <button class="burger" id="burgerBtn" aria-label="Alternar barra lateral" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">Hunt<span>Optimizer</span></div>
    <div class="topbar-sub">ferramenta da comunidade · protótipo</div>
    <div class="topbar-fill"></div>
    <div class="topbar-voc"><span class="voc-dot" id="topVocDot"></span><span id="topVocLabel">—</span></div>
  </header>

  <div class="body">
    <div class="backdrop" id="backdrop"></div>

    <aside class="sidebar" id="sidebar">

      <div class="sb-section">
        <div class="sb-title">Seu personagem</div>
        <div class="voc-grid" id="vocGrid"></div>
      </div>

      <div class="sb-section" id="charFormWrap">
        <div class="sb-title">Atributos <span style="font-weight:400;color:var(--mute)">(manuais)</span></div>
        <div class="field-grid">
          <div class="field"><label for="fLevel">Level</label><input id="fLevel" type="number" min="8" step="1"></div>
          <div class="field"><label for="fML">Magic level</label><input id="fML" type="number" min="0" step="1"></div>
          <div class="field"><label for="fHP">HP máximo</label><input id="fHP" type="number" min="0" step="50"></div>
          <div class="field"><label for="fMana">Mana máxima</label><input id="fMana" type="number" min="0" step="50"></div>
          <div class="field"><label for="fCritC">Crítico — chance %</label><input id="fCritC" type="number" min="0" max="100" step="0.5"></div>
          <div class="field"><label for="fCritE">Crítico — dano extra %</label><input id="fCritE" type="number" min="0" step="1"></div>
          <div class="field"><label for="fCharm">Charm points</label><input id="fCharm" type="number" min="0" step="100"></div>
          <div class="field"><label for="fLoyalty">Loyalty</label>
            <select id="fLoyalty">
              <option value="0">0% (sem título)</option>
              <option value="1">1%</option><option value="2">2%</option><option value="3">3%</option>
              <option value="4">4%</option><option value="5">5% (máximo)</option>
            </select>
          </div>
          <div class="field"><label for="fHit">Dano médio/acerto</label><input id="fHit" type="number" min="1" step="25"></div>
        </div>
        <small>Valores de exemplo por vocação — sobrescreva com os do seu personagem. Chance/dano crítico: Cyclopedia → Combat Stats.</small>
      </div>

      <div class="sb-section">
        <div class="sb-title">Filtrar hunts</div>
        <input class="search-input" id="fSearch" type="text" placeholder="Buscar por nome, local ou tag…">
        <div class="chiprow" id="lvlChips"></div>
        <div class="chiprow" id="diffChips"></div>
        <div class="sort-row">
          <span>Ordenar</span>
          <select id="fSort">
            <option value="fit">Melhor encaixe p/ vocação</option>
            <option value="level">Nível</option>
            <option value="name">Nome</option>
          </select>
        </div>
      </div>

      <div class="sb-section" style="border-bottom:0">
        <div class="sb-title">Hunts <span id="huntCount" style="font-weight:400"></span></div>
        <div class="hunt-list" id="huntList"></div>
      </div>

    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   DADOS — expanda aqui. Cada hunt referencia IDs de CREATURES.
   Resistências em %; >100 = fraco (bom pra atacar), <100 = forte
   (resiste). immuneTo lista elementos com 0% (bloqueado, nunca
   escolher como "melhor elemento").
   ============================================================ */

var ELEMENTS_ORDER = ['physical','fire','ice','energy','earth','death','holy'];
var EL = {
  physical:{label:'Físico',  css:'var(--el-physical)'},
  fire:    {label:'Fogo',    css:'var(--el-fire)'},
  ice:     {label:'Gelo',    css:'var(--el-ice)'},
  energy:  {label:'Energia', css:'var(--el-energy)'},
  earth:   {label:'Terra',   css:'var(--el-earth)'},
  death:   {label:'Morte',   css:'var(--el-death)'},
  holy:    {label:'Sagrado', css:'var(--el-holy)'}
};
var RUNES = {
  earth:'Stone Shower Rune', ice:'Avalanche Rune', fire:'Great Fireball Rune',
  energy:'Thunderstorm Rune', physical:'Explosion Rune', death:'Sudden Death Rune (alvo único)',
  holy:null
};

var VOCS = {
  knight:  {name:'Knight',   css:'var(--voc-knight)',   elements:[['physical',1]],
            weaponLabel:'Arma de melee (espada/machado/clava)', style:'Corpo a corpo',
            defaults:{level:700, ml:15,  hp:38000, mana:3200,  critChance:10, critExtra:35, charmPoints:4000, hit:850}},
  paladin: {name:'Paladin',  css:'var(--voc-paladin)',  elements:[['physical',1],['ice',2],['earth',2],['holy',2],['death',2],['energy',2]],
            weaponLabel:'Bow/crossbow + munição', style:'Distância',
            defaults:{level:700, ml:20,  hp:24000, mana:9000,  critChance:15, critExtra:45, charmPoints:4000, hit:700}},
  sorcerer:{name:'Sorcerer', css:'var(--voc-sorcerer)', elements:[['fire',1],['energy',1],['death',2]],
            weaponLabel:'Wand', style:'Magia',
            defaults:{level:700, ml:115, hp:5200,  mana:21000, critChance:8,  critExtra:70, charmPoints:4000, hit:600}},
  druid:   {name:'Druid',    css:'var(--voc-druid)',    elements:[['earth',1],['ice',1]],
            weaponLabel:'Rod', style:'Magia',
            defaults:{level:731, ml:117, hp:5500,  mana:24000, critChance:10, critExtra:75, charmPoints:6000, hit:650}}

function applyVocDefaults(vocKey){
  var d = VOCS[vocKey].defaults;
  setVal('fLevel', d.level); setVal('fML', d.ml); setVal('fHP', d.hp); setVal('fMana', d.mana);
  setVal('fCritC', d.critChance); setVal('fCritE', d.critExtra); setVal('fCharm', d.charmPoints); setVal('fHit', d.hit);
  readAttrs();
}
function setVal(id, v){ var el = document.getElementById(id); if(el) el.value = v; }
function readAttrs(){
  attrs = {
    level: numOr('fLevel', 300), ml: numOr('fML', 0), hp: numOr('fHP', 1000), mana: numOr('fMana', 1000),
    critChance: numOr('fCritC', 0), critExtra: numOr('fCritE', 0), charmPoints: numOr('fCharm', 0),
    loyalty: numOr('fLoyalty', 0), hit: numOr('fHit', 300)
  };
}
function numOr(id, fallback){
  var el = document.getElementById(id);
  if(!el) return fallback;
  var v = parseFloat(el.value);
  return isFinite(v) ? v : fallback;
}

/* ============================================================
   MOTOR DE CÁLCULO
   ============================================================ */
function huntAvg(hunt, element){
  var vals = hunt.creatures.map(function(cid){ return CREATURES[cid].resist[element]; });
  return vals.reduce(function(a,b){return a+b;},0) / vals.length;
}
function bestElementFor(hunt, vocKey){
  var voc = VOCS[vocKey], best = null;
  voc.elements.forEach(function(pair){
    var el = pair[0], tier = pair[1], avg = huntAvg(hunt, el);
    if(!best || avg > best.avg) best = {el:el, avg:avg, tier:tier};
  });
  return best;
}
function fitScore(hunt, vocKey){
  var voc = VOCS[vocKey], best = 0;
  voc.elements.forEach(function(pair){
    var avg = huntAvg(hunt, pair[0]);
    var score = pair[1] === 1 ? avg : avg * 0.85;
    if(score > best) best = score;
  });
  return best;
}
function aggregateThreats(hunt){
  var set = {};
  hunt.creatures.forEach(function(cid){ (CREATURES[cid].threats||[]).forEach(function(t){ set[t]=1; }); });
  return Object.keys(set);
}
function charmBreakdown(creature, a){
  var overflux  = 0.11 * Math.min(0.025*a.mana, 0.08*creature.hp);
  var overpower = 0.11 * Math.min(0.05*a.hp,   0.08*creature.hp);
  var bestEl = 'physical', bestVal = -1;
  ELEMENTS_ORDER.forEach(function(e){ if(creature.resist[e] > bestVal){ bestVal = creature.resist[e]; bestEl = e; } });
  var elemental = 0.11 * 0.05 * creature.hp * (bestVal/100);
  var C = a.critChance/100, E = a.critExtra/100;
  var base = a.hit / (1 + C*E);
  var lowBlow = base * 0.09 * E;
  var savageBlow = base * C * 0.44;
  var carnageCap = Math.min(0.15*creature.hp, 6*a.level);
  var carnage = 0.22 * carnageCap;
  return [
    {k:'Overflux', sub:'2,5% da mana, teto 8% HP', v:overflux},
    {k:'Overpower', sub:'5% do seu HP, teto 8% HP', v:overpower},
    {k:'Elemental — ' + EL[bestEl].label, sub:'5% HP × resistência', v:elemental},
    {k:'Low Blow', sub:'+9% chance de crítico', v:lowBlow},
    {k:'Savage Blow', sub:'+44% dano crítico extra', v:savageBlow},
    {k:'Carnage (por kill, em área)', sub:'22% · 15% HP, teto 6×level', v:carnage}
  ].sort(function(x,y){ return y.v - x.v; });
}

function matchesFilters(hunt){
  if(state.search){
    var q = state.search.toLowerCase();
    var hay = (hunt.name+' '+hunt.loc+' '+hunt.tags.join(' ')).toLowerCase();
    if(hay.indexOf(q) === -1) return false;
  }
  if(state.lvlFilter==='low'  && !(hunt.lvl <= 100)) return false;
  if(state.lvlFilter==='mid'  && !(hunt.lvl > 100 && hunt.lvl <= 400)) return false;
  if(state.lvlFilter==='high' && !(hunt.lvl > 400)) return false;
  if(state.diffFilter!=='all' && hunt.diff !== state.diffFilter) return false;
  return true;
}
function visibleHunts(){
  var list = HUNTS.filter(matchesFilters);
  if(state.sort==='fit') list.sort(function(a,b){ return fitScore(b,state.vocation) - fitScore(a,state.vocation); });
  else if(state.sort==='level') list.sort(function(a,b){ return a.lvl - b.lvl; });
  else list.sort(function(a,b){ return a.name.localeCompare(b.name); });
  return list;
}
function renderHuntList(){
  var list = visibleHunts();

    calcField('cCritC','Crítico chance %',attrs.critChance) + calcField('cCritE','Crítico extra %',attrs.critExtra) +
    calcField('cHit','Dano médio/acerto',attrs.hit) +
    '</div><small>Puxado dos seus atributos ao lado — mude aqui ou na barra lateral, os dois ficam sincronizados.</small></div>';

  hunt.creatures.forEach(function(cid){
    var c = CREATURES[cid];
    var rows = charmBreakdown(c, attrs);
    var max = rows[0].v || 1;
    html += '<h3 class="sub">'+c.name+' — ganho esperado por ataque</h3><div class="blist">';
    rows.forEach(function(r, i){
      html += '<div class="brow'+(i===0?' top':'')+'"><div class="blab">'+r.k+'<br><span style="color:var(--mute);font-size:.66rem">'+r.sub+'</span></div>'+
        '<div class="btrack"><i style="width:'+(r.v/max*100).toFixed(1)+'%"></i></div><div class="bval">'+r.v.toFixed(1)+'</div></div>';
    });
    html += '</div>';
  });

  var eBest = attrs.critExtra, cBest = attrs.critChance;
  var tieRatio = cBest>0 ? (eBest/cBest).toFixed(2) : '∞';
  var lowWins = (0.09*(eBest/100)) > (cBest/100*0.44);
  html += '<div class="note"><b>Low Blow vs. Savage Blow:</b> empate exato em <span class="mono">dano crítico extra = 4,89 × chance de crítico</span>. Com os seus números (razão atual '+tieRatio+'×), <b>'+(lowWins?'Low Blow':'Savage Blow')+'</b> ganha — ambos exigem uma arma com crítico (imbuement de Strike).</div>';
  html += '</section>';

  /* itens */
  html += '<section class="blk"><h2 class="sect"><i>04</i>Melhores itens</h2>'+ playbookHTML(GEAR_NOTES, hunt, state.vocation, gearGeneric(hunt, voc, best, threats)) +'</section>';

  /* gemas */
  html += '<section class="blk"><h2 class="sect"><i>05</i>Melhores gemas / wheel</h2>'+ playbookHTML(GEMS_NOTES, hunt, state.vocation, gemsGeneric(hunt, voc, best, threats)) +'</section>';

  /* loot */
  html += '<section class="blk"><h2 class="sect"><i>06</i>Loot — o que cada bicho apanha</h2>';
  html += '<div class="loot-key"><span><span class="pdot">●</span> produto de criatura (charm Gut)</span><span>r1 comum → r5 muito raro</span></div>';
  html += '<div class="loot-grid">';
  hunt.creatures.forEach(function(cid){
    var items = LOOT[cid] || [];
    html += '<div class="loot-col"><h4>'+CREATURES[cid].name+'</h4><div class="chips">'+
      items.map(function(it){ return '<span class="rchip r'+it.r+'">'+(it.p?'<span class="pdot">●</span>':'')+it.n+'</span>'; }).join('')+
      '</div></div>';
  });
  html += '</div></section>';

  html += aboutHTML();
  html += '<footer class="app-footer"><p>Tibia e todas as imagens do jogo são propriedade da CipSoft GmbH. Ferramenta não oficial, feita pela e para a comunidade.</p></footer>';
  html += '</div>';
  return html;
}

function kv(k,v){ return '<div class="kv"><dt>'+k+'</dt><dd>'+v+'</dd></div>'; }
function calcField(id,label,val){
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="number" step="any" value="'+val+'"></div>';
}
function playbookHTML(NOTES, hunt, vocKey, genericLines){
  var specific = NOTES[hunt.id] && NOTES[hunt.id][vocKey];
  var lines = specific || genericLines;
  return '<div class="play">'+
    (specific ? '<span class="verified">Verificado</span>' : '<span class="verified" style="color:var(--dim);border-color:var(--edge)">Guia calculado</span>')+
    '<ul>'+lines.map(function(l){ return '<li>'+l+'</li>'; }).join('')+'</ul></div>';
}
function gearGeneric(hunt, voc, best, threats){
  var lines = [];
  lines.push('Arma: <b>'+voc.weaponLabel+'</b> de <b>'+EL[best.el].label.toLowerCase()+'</b>'+(best.tier===2?' — elemento secundário, dano de base menor que o principal da vocação':'')+'.');
  if(threats.length) lines.push('Proteção a priorizar no set: <b>'+threats.map(function(t){return EL[t].label.toLowerCase();}).join(', ')+'</b> (é o que essas criaturas causam).');
  if(voc===VOCS.knight) lines.push('Escudo com a maior defesa disponível no seu nível + imbuement de mitigação/vida.');
  if(voc===VOCS.paladin) lines.push('Munição elemental costuma ter attack base menor que a física — use como complemento, não como dano principal.');
  lines.push('Imbuement ofensivo: dano/crítico de '+EL[best.el].label.toLowerCase()+' onde a peça permitir.');
  return lines;
}
function gemsGeneric(hunt, voc, best, threats){
  var lines = [];
  lines.push('Greater gem: mastery ofensiva ligada ao seu elemento principal ('+EL[best.el].label+').');
  lines.push('Lesser gems: Mana ou HP — veja acima qual charm (Overflux/Overpower) rende mais com os seus números — e resistência a '+(threats[0]?EL[threats[0]].label.toLowerCase():'físico')+'.');
  return lines;
}

/* ============================================================
   WIRING de detalhe (inputs sincronizados + navegação)
   ============================================================ */
function wireDetail(hunt){
  var backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', function(){ state.hunt=null; renderHuntList(); renderMain(); });

  var map = {cMana:'fMana', cHP:'fHP', cCritC:'fCritC', cCritE:'fCritE', cHit:'fHit'};
  Object.keys(map).forEach(function(localId){
    var el = document.getElementById(localId);
    if(!el) return;
    el.addEventListener('input', function(){
      document.getElementById(map[localId]).value = el.value;
      readAttrs();
      renderMain();
    });
  });
}

/* ============================================================
   SIDEBAR TOGGLE (desktop: slide, mobile: drawer + backdrop)
   ============================================================ */
function isMobile(){ return window.innerWidth <= 860; }
function openSidebar(){
  var shell = document.getElementById('shell');
  if(isMobile()){ shell.classList.add('mobile-open'); shell.classList.remove('collapsed'); }
  else { shell.classList.remove('collapsed'); }
  document.getElementById('burgerBtn').setAttribute('aria-pressed','true');
}
function closeSidebarUI(){
  var shell = document.getElementById('shell');
  shell.classList.add('collapsed');
  shell.classList.remove('mobile-open');
  document.getElementById('burgerBtn').setAttribute('aria-pressed','false');
}
function closeMobileSidebar(){ if(isMobile()) closeSidebarUI(); }
document.getElementById('burgerBtn').addEventListener('click', function(){
  var shell = document.getElementById('shell');
  var open = isMobile() ? shell.classList.contains('mobile-open') : !shell.classList.contains('collapsed');
  if(open) closeSidebarUI(); else openSidebar();
});
document.getElementById('backdrop').addEventListener('click', closeSidebarUI);

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  applyVocDefaults(state.vocation);
  renderVocGrid();
  renderTopVoc();
  renderChips();
  renderHuntList();
  renderMain();

  document.getElementById('fSearch').addEventListener('input', function(e){ state.search = e.target.value; renderHuntList(); });
  document.getElementById('fSort').addEventListener('change', function(e){ state.sort = e.target.value; renderHuntList(); });

  ['fLevel','fML','fHP','fMana','fCritC','fCritE','fCharm','fHit'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ readAttrs(); renderTopVoc(); renderMain(); });
  });
  document.getElementById('fLoyalty').addEventListener('change', function(){ readAttrs(); });

  if(!isMobile()) openSidebar();
  window.addEventListener('resize', function(){
    var shell = document.getElementById('shell');
    if(!isMobile()){ shell.classList.remove('mobile-open'); }
  });
}
boot();

})();
</script>
